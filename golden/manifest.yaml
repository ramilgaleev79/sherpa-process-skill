## Файл проекта

`golden/project/sample-project.sherpa` — формат проекта: JSON (utf-8 BOM) с `ProductVersion: "1.4.4.40162"` (точная сборка Designer), `References.Items` (NET-сборки), `Properties` (RobotName, InParams/OutParams робота, TotalBlockExecutionDelay), `Folders[].Files[]` — ссылки на `.process` по относительным путям с флагами Main/Showing/Pinned. База для будущих правил SHP-SUB-*.

## Побайтово подтверждённые бинарные форматы

### Text-контейнер (DiagramProperty @DefaultValue/@Value, Type=Text)

```
Base64( PREFIX(22) + encode_7bit(len(UTF8(ps_literal))) + UTF8(ps_literal) + 0x0B )
PREFIX = 00 01 00 00 00 FF FF FF FF 01 00 00 00 00 00 00 00 06 01 00 00 00
```

Подтверждено на образцах: пустой литерал `""`, кириллица `"Выгрузка данных из бюджетной системы."` — PREFIX константен.

- Пустая строка → `AAEAAAD/////AQAAAAAAAAAGAQAAAAIiIgs=`
- Прочие скаляры в декларации — плоские строки: Number `0`, Logical `True`/`False`, SecureString (пустой) `''`.

### Коллекции/DataTable

Hashtable/Dictionary/DataTable хранят Base64-контейнеры с тем же 17-байтовым заголовком `00 01 00 00 00 FF FF FF FF 01 00 00 00 00 00 00 00` + `06` + payload с .NET-типами (AssemblyName `System.Data…`, `System.Collections…`). Полная раскладка — ближайший шаг разбора (см. PLAN, фаза 3).

## Расхождения с текущими документами (требуют правок)

1. **Условие = `IfCondition` v46, а не `IfElse` v23** (.sch SHP-COND-*). ValueType условия = `Any Expression`, не `Logical`. IfElse — вероятно, другая (старая) версия Designer → нужна профильная привязка правил к версии.
2. **Порты — `ConnectorSettings`**, а не `Connector` (контексты правил .sch по коннекторам указывают на несуществующие элементы).
3. **`ReturnOrStop` v113** — Stop-блок.
4. **Log в двух версиях** (165 и 174) в рамках одного проекта — версии блоков плавают; подтверждает риск profile-per-Designer-version.
5. **While-условие** — P1 закрыт серией b18 (`Condition='$Переменная1 -eq $True'`); пустое условие в b14 — образец старого формата, а не текущее ограничение.

## Секреты

Проверено сканированием (password/pwd/token/Data Source/url): литеральных секретов нет; все совпадения — код шаблонов блоков и имена переменных. Путь к тестовой accdb — внутренний, без персональных данных.
