# Манифест golden-эталонов (реальные файлы, серия real/)

Источник: рабочий проект «Выгрузка данных из бюджетной системы» (Sherpa RPA Designer).
Точная версия Designer: **уточнить у пользователя** — не зафиксирована.
Имена файлов нормализованы; оригиналы лежат в исходной папке проекта.

Общее для всех файлов (подтверждено):

- Корень `Root`; секции в порядке: `DesignerItems`, `Connections`, `Properties`, `PSCache`, `Description`, `InputArguments`, `OutputArguments`.
- Файл: UTF-8 с BOM, XML declaration `<?xml version="1.0" encoding="utf-8"?>`.
- Блок = `DesignerItem` с полями в порядке: `Left, Top, Width, Height, ID (GUID), zIndex, IsGroup, IsEnabled, Description, IsPSVerified, ParentID, StorageSelectors, Content`.
- `Content` — экранированный XAML `ToolboxItemSettings` (namespace `{clr-namespace:ToolboxDesigner.Core;assembly=DiagramDesigner}`): атрибуты шаблона + `PathStyle`/`PathStyle_DragThumb` (XAML-визуал) + `Properties` (`PropertiesCollection` → `Property`: Name, Tooltip, CatalogName, Type, Value, Visible, DefaultValue, ValueType, EnumVariants, Caption, ProtoName, ReadOnly, IsRequired, IsPSVerified) + `ConnectorsSettings` (`ConnectorsSettingsCollection` → `ConnectorSettings`: Name, Orientation, RelativePosition, MaxInConnections, MaxOutConnections, Color, Caption).
- Ребро графа = `Connections/Connection` с полями: `SourceID, SinkID, SourceConnectorName, SinkConnectorName, SourceArrowSymbol, SinkArrowSymbol, zIndex`.
- У каждого блока 4 общих свойства Error processing: `ErrorLevel` (Enum Default;Ignore;Handle), `ErrorDirection` (Enum Default;Right;Bottom), `ReportLevel` (Enum Default;Release;Debug;Detailed;Output), `ErrorMessage` (Variable, `$ErrorMessage`).
- Статического Error-коннектора нет ни у While, ни у IfCondition (в этой версии).

