# Манифест golden-эталонов (реальные файлы, серия real/)

Источник: диаграммы, созданные в Sherpa Designer 1.4.4 (сборка **1.4.4.40162**) 14–15.10.2026.
Имена файлов нормализованы; оригиналы лежат в исходной папке проекта.

**Политика: эталоны принимаются ТОЛЬКО из
актуального Designer 1.4.4.40162.** Файлы 2024 года (main/init/business_error/
system_error с Log v165, TryCatch v97, FullAbort v30 и блоками DB*/RestClient/
Foreach*/ProcessContainer/Comment/FromJson/SplitString/LoadDataTable/OpenFileDialog)
удалены из базы и впредь не ingested: одно поколение блоков, без «плавающих» версий.
Удалённые блоки вернутся в каталог только со свежими golden-образцами.

Общее для всех файлов (подтверждено):

- Корень `Root`; секции в порядке: `DesignerItems`, `Connections`, `Properties`, `PSCache`, `Description`, `InputArguments`, `OutputArguments`.
- Файл: UTF-8 с BOM, XML declaration `<?xml version="1.0" encoding="utf-8"?>`.
- Блок = `DesignerItem` с полями в порядке: `Left, Top, Width, Height, ID (GUID), zIndex, IsGroup, IsEnabled, Description, IsPSVerified, ParentID, StorageSelectors, Content`.
- `Content` — экранированный XAML `ToolboxItemSettings` (namespace `{clr-namespace:ToolboxDesigner.Core;assembly=DiagramDesigner}`): атрибуты шаблона + `PathStyle`/`PathStyle_DragThumb` (XAML-визуал) + `Properties` (`PropertiesCollection` → `Property`: Name, Tooltip, CatalogName, Type, Value, Visible, DefaultValue, ValueType, EnumVariants, Caption, ProtoName, ReadOnly, IsRequired, IsPSVerified) + `ConnectorsSettings` (`ConnectorsSettingsCollection` → `ConnectorSettings`: Name, Orientation, RelativePosition, MaxInConnections, MaxOutConnections, Color, Caption).
- Ребро графа = `Connections/Connection` с полями: `SourceID, SinkID, SourceConnectorName, SinkConnectorName, SourceArrowSymbol, SinkArrowSymbol, zIndex`.
- Error processing **не универсален**. В 50 golden полный набор из четырёх свойств (`ErrorLevel`, `ErrorDirection`, `ReportLevel`, `ErrorMessage`) есть только у 6 блоков; `ErrorLevel`/`ReportLevel` — у 44, `ErrorMessage` — у 43, `ErrorDirection` — у 7. В текущем каталоге 752: `ErrorLevel` 737, `ReportLevel` 738, `ErrorMessage` 736, `ErrorDirection` 37; у `Comment`/`PointConnector`/`ToDoBlock` свойств нет, у 14 блоков нет ни одного из четырёх. Типы/варианты — `ErrorLevel` (Enum Default;Ignore;Handle), `ErrorDirection` (Enum Default;Right;Bottom), `ReportLevel` (Enum Default;Release;Debug;Detailed;Output), `ErrorMessage` (Variable, `$ErrorMessage`).
- Статического Error-коннектора нет ни у While, ни у IfCondition (в этой версии).

## Провенанс формата: IL-verified против Designer 1.4.4.40199

Статическим разбором DiagramDesigner.exe сборки **1.4.4.40199**
(sha256 `564a0e77be0375bbc6f01986342a53cfe5b0164926e4158ed7546e877be7b092`,
MVID `12d13942-7398-440f-b9f5-932531dd44e1`, evidence `ev_362fbcd2…`/`ev_c24d01ac…`,
IL-листинги — карта Sherpa RPA, `rea-l3/il-designer-serialize.txt` и
`rea-l3/il-designer-load-check.txt`) подтверждено, что golden-факты выше —
не совпадения корпуса, а поведение кода:

- Сериализация: `DiagramViewModel::SerializeDiagram` (LINQ to XML, литеральные
  теги) — порядок секций Root и состав полей `DesignerItem`/`Connection`
  ровно как в этом манифесте; `Content = XamlWriter.Save(ToolboxItemSettings)`.
- Загрузка: `ClassSystem::DeserializeDesignerItem` — `Content → RemoveAllStyles
  → XmlReader → XamlReader.Load`; поля читаются с дефолтами (IsEnabled/IsPSVerified
  по умолчанию True, Width/Height InvariantCulture, ParentID Guid), т.е.
  отсутствующее поле — допустимо. Стили при загрузке вырезаются: `PathStyle`
  в файлах не требуется.
- Дизайнерский рефакторинг выражений: `ClassRefactoringExpression125::Processed`
  — построчно, вне кавычек `"`/`'`, директивы `#stoprefactoring`/
  `#startrefactoring` (TrimStart+ToLower+Trim) переключают обработку.
  Семантика реализована в `scripts/sherpa_xml/designer_refactor.py`
  (операция `rename_variables`).
- Save-gate Designer (`CheckBlocksProcess`) узок: проверяет только ссылки
  вложенных диаграмм у `ProcessContainer` (GetNestedDiagramName + FileInfo.Exists
  + AddLinkForDiagram) — «блоки вне каталога» и т.п. Designer при сохранении
  не валидирует; это делает только наш каталог.
- Автосейв: `AutoSaveProcessed` пишет скрытый `~<имя>` рядом с файлом —
  такие файлы в корпус/ревью не входят (см. corpus_mine/replay_corpus/
  corpus_stats/build_verb_index, LNT-BAK-001).
- Открытые вопросы (уровень 4 карты): семантика `PSCache` (в Designer поле
  VM, кроме сериализации никем не читается — считаем opaque и не трогаем);
  устройство `.sherpax`; условное 14-е поле `DesignerItem` (слот с динамическим
  именем между Description и IsPSVerified; в реальных файлах не наблюдается).

Отличие сборок: golden-файлы сняты с **1.4.4.40162**, IL-факты — с
**1.4.4.40199**; лицензионное ядро и сериализационный тракт между этими
сборками идентичны (сверено на 1.4.0.36597 / 1.4.4.40199 — карты Sherpa RPA).

